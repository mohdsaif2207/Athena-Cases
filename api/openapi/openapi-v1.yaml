openapi: 3.0.3
info:
  title: Athena Cases API
  version: 1.0.0
  description: >
    Contract-first OpenAPI skeleton for the Case Management System.
    Feature paths are added by module owners; shared paths by the Lead.
servers:
  - url: http://localhost:8080
    description: Local dev
tags:
  - name: Health
  - name: Cases
  - name: Lookups
  - name: BillingDepartmentRequest
  - name: DbmWorkOrderRequest
  - name: ExrtRequest
paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHealth'
components:
  schemas:
    ApiResponseHealth:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: UP
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
              nullable: true
            requestId:
              type: string
            timestamp:
              type: string
              format: date-time
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
