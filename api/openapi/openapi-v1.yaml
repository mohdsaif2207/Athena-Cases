openapi: 3.0.3
info:
  title: Athena Cases API
  version: 1.0.0
  description: >
    Contract-first OpenAPI for the Case Management System.
    Feature paths are added by module owners; shared paths by the Lead.
servers:
  - url: http://localhost:8080
    description: Local dev
tags:
  - name: Health
  - name: Auth
  - name: Cases
  - name: Lookups
  - name: BillingDepartmentRequest
  - name: DbmWorkOrderRequest
  - name: ExrtRequest
paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHealth'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate user and issue JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLogin'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 100
          format: password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresInMinutes:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    ApiResponseLogin:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/LoginResponse'
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ApiResponseHealth:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: UP
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
              nullable: true
            requestId:
              type: string
            timestamp:
              type: string
              format: date-time
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
