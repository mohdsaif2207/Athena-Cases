# Local development — defaults to H2; point DB_URL + DB_DRIVER at Postgres when available.
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/cases-mt;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # Dev-only default; override via JWT_SECRET in shared/non-local environments
    secret: ${JWT_SECRET:athena-cases-dev-jwt-secret-key-change-me-32chars-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  default:
    admin:
      seed-enabled: true
      username: ${ADMIN_USERNAME:fm_admin}
      password: ${ADMIN_PASSWORD:FM@Admin123}
      display-name: ${ADMIN_DISPLAY_NAME:ADMKL}

logging:
  level:
    root: INFO
    com.athena.cases: DEBUG
