# Local development — PostgreSQL.
# URL / username / password: application.properties (do not set H2 defaults here).
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        default_schema: cases_mt
  flyway:
    schemas: cases_mt
    default-schema: cases_mt
    create-schemas: true
    # Shared RDS may have teammate migrations not present in this branch yet.
    ignore-migration-patterns: "*:missing"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # Dev-only default; override via JWT_SECRET in shared/non-local environments
    secret: ${JWT_SECRET:athena-cases-dev-jwt-secret-key-change-me-32chars-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  default:
    admin:
      seed-enabled: true
      username: ${ADMIN_USERNAME:fm_admin}
      password: ${ADMIN_PASSWORD:FM@Admin123}
      display-name: ${ADMIN_DISPLAY_NAME:ADMKL}

logging:
  level:
    root: INFO
    com.athena.cases: DEBUG
