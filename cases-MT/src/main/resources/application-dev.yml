# Dev profile — PostgreSQL (ExRT + DBM + IAM). Credentials from Athena-Cases/.env only.
# Schema follows DB_URL (search_path / currentSchema). Do NOT hardcode a schema here:
# forcing a schema that differs from .env makes login/create hit a different schema
# than the one you inspect in the DB client.
spring:
  datasource:
    url: ${DB_URL:?Set DB_URL in Athena-Cases/.env}
    username: ${DB_USER:?Set DB_USER in Athena-Cases/.env}
    password: ${DB_PASSWORD:?Set DB_PASSWORD in Athena-Cases/.env}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    create-schemas: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # Dev-only default; override via JWT_SECRET in shared/non-local environments
    secret: ${JWT_SECRET:athena-cases-dev-jwt-secret-key-change-me-32chars-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  default:
    admin:
      seed-enabled: true
      username: ${ADMIN_USERNAME:fm_admin}
      password: ${ADMIN_PASSWORD:FM@Admin123}
      display-name: ${ADMIN_DISPLAY_NAME:ADMKL}

logging:
  level:
    root: INFO
    com.athena.cases: DEBUG
    com.athena.cases.features.exrt: INFO
    com.athena.cases.features.dbm: DEBUG
