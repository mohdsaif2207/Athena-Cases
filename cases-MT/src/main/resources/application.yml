spring:
  application:
    name: cases-mt
  profiles:
    default: dev
  # Fallback import (IDE/Maven). Primary loader: DotEnvEnvironmentPostProcessor
  # which finds Athena-Cases/.env or cases-MT/.env regardless of minor path quirks.
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/features

server:
  port: ${SERVER_PORT:8090}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.athena.cases.features.exrt: INFO
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO
    org.springframework.boot.flyway: INFO
