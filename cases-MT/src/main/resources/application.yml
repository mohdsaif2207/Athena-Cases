spring:
  application:
    name: cases-mt
  profiles:
    default: dev
  # Fallback import (IDE/Maven). Primary loader: DotEnvEnvironmentPostProcessor
  # which finds Athena-Cases/.env or cases-MT/.env regardless of minor path quirks.
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Required for shared Postgres when parallel feature branches stamp interleaved
    # versions (e.g. IAM 1300/1800/1900 after ExRT tip 1945). Validation stays on.
    out-of-order: true
    locations: classpath:db/migration/common,classpath:db/migration/lookups,classpath:db/migration/audit,classpath:db/migration/features
    baseline-on-migrate: true

server:
  # Standardized local/backend port — do not change to 8080
  port: ${SERVER_PORT:8090}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:athena-cases}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  default:
    admin:
      seed-enabled: ${ADMIN_SEED_ENABLED:false}
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
      display-name: ${ADMIN_DISPLAY_NAME:ADMKL}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.athena.cases: INFO
    com.athena.cases.features.exrt: INFO
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO
    org.springframework.boot.flyway: INFO
