spring:
  application:
    name: cases-mt
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/lookups,classpath:db/migration/audit,classpath:db/migration/features
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:athena-cases}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  default:
    admin:
      seed-enabled: ${ADMIN_SEED_ENABLED:false}
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
      display-name: ${ADMIN_DISPLAY_NAME:ADMKL}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.athena.cases: INFO
