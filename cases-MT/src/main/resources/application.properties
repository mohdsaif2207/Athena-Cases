spring.application.name=cases-mt

# PostgreSQL — values injected via environment / .env (no secrets in source)
spring.datasource.url=${DB_URL:jdbc:postgresql://insurance-db.cpmmyssa6fll.ap-south-1.rds.amazonaws.com:5432/insurance_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — schema owned by Flyway; do not auto-create/alter tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway — scripts under src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
